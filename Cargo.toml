[workspace]
resolver = "2"
members = ["core", "gui"]

[workspace.package]
version = "2.3.10"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["clock"] }
csv = "1"
eframe = "0.29"
egui = "0.29"
embed-resource = "2"
encoding_rs = "0.8"
filetime = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.10"
rayon = "1"
regex = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
zip = "2"

rust_xlsxwriter = "0.102"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
dirs = "7"
